<div class="login">
  <div class="login__card card">
    <h1 class="login__title">ACME Salary Management</h1>
    <p class="login__subtitle">Sign in to continue</p>

    @if (sessionExpired()) {
      <!-- Explains why the user is looking at this screen rather than the one they left. -->
      <p class="alert alert--info" role="status">
        Your session ended. Please sign in again.
      </p>
    }

    @if (errorMessage(); as message) {
      <!--
        role="alert" so the failure is announced. The message comes from the server, which
        says only "Invalid email or password" — it does not reveal which half was wrong.
      -->
      <p class="alert alert--error" role="alert">{{ message }}</p>
    }

    <form class="login__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label class="field__label" for="email">Email address</label>
        <input
          id="email"
          class="input"
          [class.input--invalid]="showsError('email')"
          type="email"
          formControlName="email"
          autocomplete="username"
          inputmode="email"
          autocapitalize="off"
          spellcheck="false"
          required
          [attr.aria-invalid]="showsError('email')"
          [attr.aria-describedby]="showsError('email') ? 'email-error' : null"
        />
        @if (showsError('email')) {
          <p class="field__error" id="email-error">{{ errorFor('email') }}</p>
        }
      </div>

      <div class="field">
        <label class="field__label" for="password">Password</label>
        <input
          id="password"
          class="input"
          [class.input--invalid]="showsError('password')"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          required
          [attr.aria-invalid]="showsError('password')"
          [attr.aria-describedby]="showsError('password') ? 'password-error' : null"
        />
        @if (showsError('password')) {
          <p class="field__error" id="password-error">{{ errorFor('password') }}</p>
        }
      </div>

      <button class="button button--primary login__submit" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
